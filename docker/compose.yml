# Two services, one volume, one command. No database server and no broker: the schedule is a table
# (research.md) and the default store is SQLite in the volume below. The frontend is always present
# in the normal stack; compose.dev.yml overlays it with Vite for development.
services:
  aggregato:
    # The published backend image, so `docker compose pull` works (docs/operations.md) — pin a
    # release with AGGREGATO_VERSION=0.2.4. The build section stays: with no image pulled, `up`
    # builds from this checkout, which is what a development run and a source install both want.
    image: ghcr.io/minipps/aggregato:${AGGREGATO_VERSION:-0.2.4}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    # Every setting the application reads, with the defaults shown. Uncommented lines are the ones
    # this image sets: those it needs, plus optional ones forwarded from your .env, which are empty
    # when you leave them out and an empty value counts as unset. The rest are commented examples,
    # and .env.example is the same contract for a non-Docker run. Settings resolve:
    # defaults <- AGGREGATO_CONFIG file <- environment. Provider settings saved in the UI are stored
    # in the database and read by the worker when it starts a provider run.
    environment:
      # The only fatal configuration error . Generate: openssl rand -hex 32
      AGGREGATO_TOKEN: ${AGGREGATO_TOKEN:?set AGGREGATO_TOKEN before starting}
      AGGREGATO_DATA: /data
      # Import storage quotas include the upload currently being admitted.
      AGGREGATO_IMPORT_QUOTA_BYTES: ${AGGREGATO_IMPORT_QUOTA_BYTES:-536870912}
      AGGREGATO_IMPORT_TOTAL_QUOTA_BYTES: ${AGGREGATO_IMPORT_TOTAL_QUOTA_BYTES:-2147483648}
      # A second token that can only read: every write is refused with 403, so it can be handed to
      # someone who should browse the archive but not change it. Must differ from AGGREGATO_TOKEN.
      AGGREGATO_READONLY_TOKEN: ${AGGREGATO_READONLY_TOKEN:-}
      # Allow credential-free frontend/API reads; writes and websockets remain protected.
      AGGREGATO_ALLOW_UNAUTHENTICATED_READONLY: ${AGGREGATO_ALLOW_UNAUTHENTICATED_READONLY:-false}
      # Browser origins allowed to call the API cross-origin, comma-separated. Empty — the default —
      # mounts no CORS middleware, which is what a same-origin deployment wants.
      AGGREGATO_CORS_ORIGINS: ${AGGREGATO_CORS_ORIGINS:-}
      # Only these proxy addresses may supply forwarded scheme/host headers to uvicorn.
      AGGREGATO_FORWARDED_ALLOW_IPS: ${AGGREGATO_FORWARDED_ALLOW_IPS:-127.0.0.1}
      # What uvicorn binds inside the container. 0.0.0.0 is right here — the frontend is the only
      # published service — so change this only if you know why.
      # AGGREGATO_HOST: 0.0.0.0
      # The container-internal API port. The frontend proxy uses this service port.
      # AGGREGATO_PORT: 8000
      # Optional: point at Postgres past roughly 1M entries. Default is SQLite under AGGREGATO_DATA.
      # AGGREGATO_DATABASE_URL: postgresql+asyncpg://aggregato:secret@db/aggregato
      # Optional YAML config file, for settings the UI then shows as file-pinned. Mount it first.
      # AGGREGATO_CONFIG: /data/config.yaml
      # Optional directory of your own provider packages, discovered from static metadata as
      # unreviewed drop-ins. Selecting one loads its package; this is not an OS sandbox.
      # AGGREGATO_PROVIDER_DIR: /data/providers
      # Provider credentials are not settings of their own: the YAML config references them as
      # ${VAR}, resolved at read time and never written back. Pass whichever ones your config names.
      # LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
      # ANILIST_TOKEN: ${ANILIST_TOKEN:-}
    volumes:
      - aggregato-data:/data
    healthcheck:
      # Every endpoint requires auth , so there is no URL to probe without holding the
      # token. Accepting the listening socket as the liveness signal is the honest check here;
      # per-provider health is what GET /health is for, and that is an operator question.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    # The published SPA image. It is the public service: Nginx serves the built frontend and proxies
    # /api to aggregato, so the API container never needs to publish a host port.
    image: ghcr.io/minipps/aggregato-frontend:${AGGREGATO_VERSION:-0.2.4}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${AGGREGATO_FRONTEND_PORT:-8000}:80"
    depends_on:
      aggregato:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  aggregato-data:
