# Development overlay: run both halves from this checkout instead of the published images. Keep this
# separate from compose.yml so the normal stack remains the complete, always-on deployment.
#
#   docker compose -f compose.yml -f compose.dev.yml up --build
#
# The overlay replaces each published image with the matching local build. `pull_policy: build` keeps
# a development run from testing a checkout against a stale release pulled from the registry.
services:
  aggregato:
    image: aggregato:dev
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      # Turns on uvicorn's reloader in the entrypoint. Unset in production, where a watcher is
      # overhead and a code change means a new image.
      AGGREGATO_RELOAD: "1"
    volumes:
      # The image installs the package editable against /app, so this is all live-code takes.
      # Read-only: the container has no business writing to the checkout.
      - ../aggregato:/app/aggregato:ro
      # ponytail: only the API reloads. The scheduler is a plain `python -m`, so a change to worker
      # or provider code needs `docker compose restart aggregato` — worth a supervisor watching both
      # only if that restart becomes the common case.
    develop:
      watch:
        # Dependency changes are the one edit a bind mount cannot carry: rebuild instead.
        - path: ../pyproject.toml
          action: rebuild
        - path: ../uv.lock
          action: rebuild

  frontend:
    image: aggregato-frontend:dev
    pull_policy: build
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: development
    working_dir: /app
    command: ["npm", "--loglevel=error", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    # The only setting the dev server has of its own; everything else the application reads is on
    # the `aggregato` service in compose.yml. It uses the same published host port as production.
    environment:
      # Where Vite proxies /api. The service name resolves on the compose network; outside Docker the
      # default is http://localhost:8000.
      VITE_API_TARGET: http://aggregato:8000
    volumes:
      - ../frontend:/app
      # Do not write Linux container dependencies into the bind-mounted checkout.
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      aggregato:
        condition: service_healthy

volumes:
  frontend-node-modules:
