name: Release

# Tag a merged version bump with scripts/release.sh --tag <version>, then approve publishing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Release tag belongs to main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # The same gates a push to main runs, by reference rather than by copy. A tag that cannot pass CI
  # does not become a release.
  gates:
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: gates
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # `--generate-notes` diffs against the previous tag, so the tags have to be present.
          fetch-depth: 0

      - name: Tag matches the declared version
        # Three files state the version and a release names a fourth thing; disagreement means an
        # operator cannot tell what they are running. Caught here rather than after publishing.
        # Kept identical to the gate in scripts/release.sh, which exists to fail before the tag is
        # public — one of the two being laxer is how a stale uv.lock reached v0.1.1.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python - "$tag" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          tag = sys.argv[1]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          frontend = json.loads(pathlib.Path("frontend/package.json").read_text())["version"]
          packages = tomllib.loads(pathlib.Path("uv.lock").read_text())["package"]
          locked = next(p["version"] for p in packages if p["name"] == "aggregato")
          if {project, frontend, locked} != {tag}:
              sys.exit(
                  f"tag v{tag} disagrees: pyproject {project}, frontend {frontend}, uv.lock {locked}"
              )
          expected_examples = {
              pathlib.Path("README.md"): f"AGGREGATO_VERSION={tag}",
              pathlib.Path("docker/compose.yml"): f"AGGREGATO_VERSION={tag}",
          }
          missing = [
              str(path) for path, marker in expected_examples.items() if marker not in path.read_text()
          ]
          if missing:
              sys.exit(f"release examples do not name v{tag}: {', '.join(missing)}")
          PY

      - name: Build the release archive
        # `git archive` honours the export-ignore rules in .gitattributes, so this carries what is
        # needed to run Aggregato or build its image and nothing that only exists to develop it.
        # GitHub's own generated source archives honour the same rules, so all three assets agree.
        run: |
          git archive --format=tar.gz --prefix="aggregato-${GITHUB_REF_NAME}/" \
            -o "aggregato-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_SHA"
          tar -tzf "aggregato-${GITHUB_REF_NAME}.tar.gz" | sed -n '1,40p'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "aggregato-${GITHUB_REF_NAME}.tar.gz" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

  # The images are what docs/operations.md tells an operator to pull, so a release that did not
  # publish both backend and frontend images would leave that instruction false.
  image:
    # After the release rather than beside it: the tarball job takes seconds, and if it is going to
    # fail — a rejected token, a version disagreement — it should fail before an image is published
    # under a tag that has no release.
    needs: [gates, release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aggregato
            suffix: ""
            file: docker/Dockerfile
          - image: aggregato-frontend
            suffix: -frontend
            file: docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # arm64 is emulated, which makes the SPA stage slow — minutes, on a tag-only workflow. Worth
      # it: a self-hosted single-user service lands on Raspberry Pis and Apple silicon at least as
      # often as on amd64, and an operator there cannot build their way out of an amd64-only image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The job's own token, scoped by `packages: write` above. No long-lived registry secret.
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Lowercased by the action, which ghcr requires and a repository name does not guarantee.
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          # A vX.Y.Z tag publishes X.Y.Z, X.Y and latest: pin exactly, follow a minor line, or track
          # the newest. `latest` moves only on a tag, never on a push to main.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry, so a release that only changes Python code does not rebuild
          # node_modules from scratch.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # BuildKit attaches an SBOM and in-toto provenance attestation to the pushed image.
          # The provenance step below binds that digest to this workflow identity.
          sbom: true
          provenance: mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify image provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            "oci://ghcr.io/${{ github.repository }}${{ matrix.suffix }}@${{ steps.build.outputs.digest }}" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
