name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the release workflow runs these same gates instead of a second copy of them that can drift.
  workflow_call:

# Constitution "Quality Gates": all four must be clean, warnings are errors.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --dev

      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Decoupling contract
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -m "not bench"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build
