name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the release workflow runs these same gates instead of a second copy of them that can drift.
  workflow_call:

permissions:
  contents: read

# Run the repository's quality gates; warnings are errors.
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --dev

      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Decoupling contract
        run: uv run lint-imports
      - name: Documentation links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urlsplit

          root = Path.cwd()
          link_re = re.compile(r"(?<!!)\[[^\]]+\]\(([^)\s]+)")
          sources = [root / "README.md", *sorted((root / "docs").rglob("*.md"))]
          missing = []
          for source in sources:
              for raw in link_re.findall(source.read_text(encoding="utf-8")):
                  target = raw.strip("<>")
                  parsed = urlsplit(target)
                  if parsed.scheme or target.startswith("#"):
                      continue
                  path = re.sub(r":\d+$", "", parsed.path)
                  if not (source.parent / path).resolve().exists():
                      missing.append(f"{source}:{raw}")
          if missing:
              raise SystemExit("broken relative documentation links:\n" + "\n".join(missing))
          print(f"checked {len(sources)} Markdown files")
          PY
      - name: Non-benchmark collection guard
        run: |
          collected="$(uv run pytest --collect-only -q -m 'not bench')"
          printf '%s\n' "$collected"
          if printf '%s\n' "$collected" | rg -q 'tests/bench/'; then
            echo "tests/bench was collected by the non-benchmark expression" >&2
            exit 1
          fi
      - name: Tests
        run: timeout --foreground --signal=TERM --kill-after=30s 15m uv run pytest -m "not bench" -vv --durations=25

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Benchmark collection
        run: uv run pytest --collect-only -q -m bench tests/bench
      - name: Benchmark harness checks
        run: timeout --foreground --signal=TERM --kill-after=30s 15m uv run pytest -m bench tests/bench -q --durations=25

  postgres:
    # PostgreSQL is a supported backend, but the ordinary pytest suite deliberately blocks all
    # sockets. Keep this explicit service smoke check separate so offline tests stay hermetic while
    # the dialect-specific migration/claim/retry/writer/search path remains a merge gate.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: aggregato
          POSTGRES_PASSWORD: aggregato
          POSTGRES_DB: aggregato
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aggregato -d aggregato"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: PostgreSQL portability and concurrency smoke
        env:
          AGGREGATO_POSTGRES_URL: postgresql+asyncpg://aggregato:aggregato@127.0.0.1:5432/aggregato
        run: timeout --foreground --signal=TERM --kill-after=30s 10m uv run python scripts/postgres_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.10.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build
