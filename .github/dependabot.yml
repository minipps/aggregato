version: 2
updates:
  # Dockerfile base images are exact tags, not moving aliases. Dependabot proposes reviewed
  # updates so the image supply chain gets a bounded, visible refresh rather than silent drift.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
