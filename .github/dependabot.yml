version: 2
updates:
  # Dockerfile and Compose base images are exact tags plus digests. Dependabot proposes reviewed
  # updates in the directory that contains them, so the image supply chain gets a bounded, visible
  # refresh rather than silent drift.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
