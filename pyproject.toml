[project]
name = "aggregato"
version = "1.0.0"
description = "Self-hosted media log aggregator"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "defusedxml>=0.7.1",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "httpx2>=2.13.1",
    "pyyaml>=6.0",
    "puremagic>=1.30",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
    "python-e18e",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aggregato"]

# --- Python formatting, linting, and type checking ---

[tool.ruff]
line-length = 100
target-version = "py313"
# Keep canonical prose and Alembic revisions outside automatic formatting.
extend-exclude = ["aggregato/db/migrations/versions", "**/*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "C4",               # comprehensions
    "TID",              # tidy imports
    "RUF",
    "ASYNC",
    "S",                # bandit
    "DTZ",              # naive datetime — stored timestamps must be timezone-aware
    "ANN001", "ANN002", "ANN003",  # require parameter annotations (formerly mypy strict)
    "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",  # require return annotations
]
ignore = [
    "S101",  # asserts are how tests assert
    # The design documents this code cites use typographic dashes and arrows throughout
    # ("media_type → media_family", "0–100"). Flagging them would mean either mangling the prose
    # or a noqa on every docstring.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ANN"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["aggregato"]
# Preserve the existing exclusion of Alembic runtime and generated revisions.
exclude = ["aggregato/db/migrations"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "error"
unused-ignore-comment = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
faulthandler_timeout = 60
markers = ["bench: performance budget checks (performance guidance)"]

# --- Import boundaries ---

[tool.importlinter]
root_packages = ["aggregato"]
# Needed because one contract forbids an *external* module (httpx2) rather than a first-party one.
include_external_packages = true
# A `if TYPE_CHECKING:` import cannot construct anything at runtime, so it cannot break any contract
# here — the rules below are about reachable capability, not about which names a module can spell.
# Session-level rather than per-contract: import-linter reads this once, when building the graph.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Providers cannot reach storage, ingest, or an HTTP client of their own"
type = "forbidden"
source_modules = ["aggregato.providers"]
forbidden_modules = ["aggregato.db", "aggregato.ingest", "httpx", "httpx2"]
# `providers/http.py` is the host-owned client wrapper for request pacing, so it is exempted from
# the rule against importing httpx2. The import rule applies to bundled provider
# code; drop-in packages are unreviewed Python and are not sandboxed.
#
# `providers/base.py` gets no exemption and needs none: it takes the httpx2 *type* behind
# `if TYPE_CHECKING`, which the session-level exclude_type_checking_imports above discounts.
ignore_imports = ["aggregato.providers.http -> httpx2"]

[[tool.importlinter.contracts]]
name = "The API never drives the scheduler in-process"
type = "forbidden"
source_modules = ["aggregato.api"]
forbidden_modules = ["aggregato.sync"]

[[tool.importlinter.contracts]]
name = "Dependencies point inward toward the domain"
type = "layers"
layers = [
    "aggregato.api | aggregato.sync",
    "aggregato.ingest",
    "aggregato.db",
    "aggregato.domain",
]
exhaustive = false

[tool.uv.sources]
python-e18e = { git = "https://github.com/python-e18e/cli", rev = "1cb588e5b4a039f8c1e426287dc1191c40abbbf8" }
