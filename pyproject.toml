[project]
name = "aggregato"
version = "0.1.0"
description = "Self-hosted media log aggregator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aggregato"]

# --- T002: formatter, linter, type checker. Warnings are errors (Constitution I). ---

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["aggregato/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM",              # simplify
    "C4",               # comprehensions
    "TID",              # tidy imports
    "RUF",
    "ASYNC",
    "S",                # bandit
    "DTZ",              # naive datetime — every timestamp is UTC-aware (data-model.md)
]
ignore = [
    "S101",  # asserts are how tests assert
    # The design documents this code cites use typographic dashes and arrows throughout
    # ("media_type → media_family", "0–100"). Flagging them would mean either mangling the prose
    # or a noqa on every docstring.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
files = ["aggregato"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
# Alembic's generated revision modules are not typed and are not hand-maintained code.
exclude = "aggregato/db/migrations/versions"

[[tool.mypy.overrides]]
module = "aggregato.db.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["bench: performance budget checks (Constitution VI)"]

# --- T003: the decoupling contract is a merge gate, not a convention (Constitution IV). ---

[tool.importlinter]
root_packages = ["aggregato"]
# Needed because one contract forbids an *external* module (httpx) rather than a first-party one.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Providers cannot reach storage, ingest, or an HTTP client of their own"
type = "forbidden"
source_modules = ["aggregato.providers"]
forbidden_modules = ["aggregato.db", "aggregato.ingest", "httpx"]
# No exemption for `aggregato.providers.base` either: the host builds the client and hands it over
# in ProviderContext (research.md R9), so the provider tree only ever needs the *type*, which it
# takes behind `if TYPE_CHECKING` rather than as a runtime import.

[[tool.importlinter.contracts]]
name = "The API never drives the scheduler in-process"
type = "forbidden"
source_modules = ["aggregato.api"]
forbidden_modules = ["aggregato.sync"]

[[tool.importlinter.contracts]]
name = "Dependencies point inward toward the domain"
type = "layers"
layers = [
    "aggregato.api | aggregato.sync",
    "aggregato.ingest",
    "aggregato.db",
    "aggregato.domain",
]
exhaustive = false
