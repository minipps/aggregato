; Alembic's CLI entry point . Deliberately minimal.
;
; There is no `sqlalchemy.url` here: the URL is a *setting* resolved by `aggregato.config`
; (defaults <- YAML <- ${ENV} <- database), so duplicating it in a second file is how the two
; drift apart. `aggregato.db.migrate.upgrade_to_head` passes it in; an operator running the CLI
; by hand passes `-x url=...`.
;
; No [loggers]/[handlers] sections either — env.py does not call fileConfig, because
; `aggregato.logging` owns logging configuration for the whole process.

[alembic]
script_location = aggregato/db/migrations
prepend_sys_path = .
